<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>목차 화면 전환 예제</title>
  <style>
    /* 전체 레이아웃 (좌측: 목차, 우측: 내용) */
    body {
      display: flex;
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
    }

    /* 목차 메뉴 스타일 */
    nav {
      width: 200px;
      background-color: #f4f4f4;
      border-right: 1px solid #ccc;
      padding: 20px;
    }

    nav ul {
      list-style-type: none;
      padding: 0;
    }

    nav li {
      padding: 12px 15px;
      margin-bottom: 8px;
      cursor: pointer;
      background-color: #ffffff;
      border-radius: 4px;
      border: 1px solid #ddd;
      transition: background 0.2s;
    }

    nav li:hover {
      background-color: #e2e2e2;
    }

    /* 선택된 목차 메뉴 강조 */
    nav li.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    /* 화면 내용 영역 */
    main {
      flex: 1;
      padding: 40px;
    }

    /* 기본적으로 화면들은 숨김 처리 */
    .tab-content {
      display: none;
    }

    /* active 클래스가 붙은 화면만 보임 */
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. 목차 메뉴 -->
  <nav>
    <h3>목차</h3>
    <ul>
      <li class="menu-item active" onclick="changeTab('tab1', this)">1. 소개</li>
      <li class="menu-item" onclick="changeTab('tab2', this)">2. 기능</li>
      <li class="menu-item" onclick="changeTab('tab3', this)">3. 문의하기</li>
    </ul>
  </nav>

  <!-- 2. 화면 내용 영역 -->
  <main>
    <div id="tab1" class="tab-content active">
      <h2>1. 소개 화면</h2>
      <p>첫 번째 목차를 클릭했을 때 보이는 내용입니다.</p>
    </div>

    <div id="tab2" class="tab-content">
      <h2>2. 기능 화면</h2>
      <p>두 번째 목차를 클릭했을 때 보이는 내용입니다.</p>
    </div>

    <div id="tab3" class="tab-content">
      <h2>3. 문의하기 화면</h2>
      <p>세 번째 목차를 클릭했을 때 보이는 내용입니다.</p>
    </div>
  </main>

  <!-- 3. 화면 전환 자바스크립트 -->
  <script>
    function changeTab(tabId, element) {
      // 모든 화면 숨기기
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      // 모든 메뉴의 활성화(색상) 표시 제거
      const menuItems = document.querySelectorAll('.menu-item');
      menuItems.forEach(item => item.classList.remove('active'));

      // 선택한 화면 보이기 & 선택한 메뉴 강조
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }
  </script>

</body>
</html>
