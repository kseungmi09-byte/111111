<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍹 커스텀 음료 만들기 - 승미의 다이어리</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --main-color: #2D6A4F;
            --bg-color: #E8F5E9;
            --card-bg: #FFFFFF;
            --text-color: #1B4332;
            --grid-color: rgba(27, 67, 50, 0.08);
        }

        body.dark-mode {
            --bg-color: #121614;
            --card-bg: #1E2622;
            --text-color: #F0F5F2;
            --grid-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard Variable", sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            text-decoration: none;
            color: var(--main-color);
            font-weight: 700;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--main-color);
            font-size: 0.9rem;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border: 2px solid var(--main-color);
        }

        h1 { color: var(--main-color); text-align: center; margin-bottom: 8px; font-size: 1.5rem; }
        p.subtitle { text-align: center; color: var(--text-color); opacity: 0.8; font-size: 0.9rem; margin-bottom: 25px; }

        .drink-preview {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            border: 1.5px dashed var(--main-color);
        }

        .drink-icon { font-size: 4rem; margin-bottom: 10px; display: block; }
        .drink-title { font-size: 1.15rem; font-weight: 800; color: var(--main-color); }
        .drink-recipe { font-size: 0.85rem; color: var(--text-color); opacity: 0.8; margin-top: 6px; }

        .option-group { margin-bottom: 18px; }
        .option-title { font-size: 0.9rem; font-weight: 700; color: var(--main-color); margin-bottom: 8px; }
        
        .option-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .opt-btn {
            background: var(--bg-color);
            border: 1px solid var(--main-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .opt-btn.active {
            background: var(--main-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">⬅️ 다이어리로 돌아가기</a>
    </header>

    <div class="container">
        <h1>🍹 커스텀 음료 만들기</h1>
        <p class="subtitle">옵션을 조합해 나만의 특별한 메뉴를 완성해 보세요!</p>

        <div class="drink-preview">
            <span id="preview-icon" class="drink-icon">🍵</span>
            <div id="preview-title" class="drink-title">말차 라떼</div>
            <div id="preview-recipe" class="drink-recipe">베이스: 말차 | 우유: 일반 우유 | 시럽: 기본 | 토핑: 없음</div>
        </div>

        <div class="option-group">
            <div class="option-title">1. 베이스 선택</div>
            <div class="option-buttons" id="base-group">
                <button class="opt-btn active" onclick="selectOpt('base', '말차', '🍵')">말차 🍵</button>
                <button class="opt-btn" onclick="selectOpt('base', '에스프레소', '☕')">에스프레소 ☕</button>
                <button class="opt-btn" onclick="selectOpt('base', '딸기', '🍓')">딸기 🍓</button>
                <button class="opt-btn" onclick="selectOpt('base', '초콜릿', '🍫')">초콜릿 🍫</button>
            </div>
        </div>

        <div class="option-group">
            <div class="option-title">2. 우유 선택</div>
            <div class="option-buttons" id="milk-group">
                <button class="opt-btn active" onclick="selectOpt('milk', '일반 우유')">일반 우유 🥛</button>
                <button class="opt-btn" onclick="selectOpt('milk', '두유')">두유 🌾</button>
                <button class="opt-btn" onclick="selectOpt('milk', '아몬드유')">아몬드유 🥜</button>
            </div>
        </div>

        <div class="option-group">
            <div class="option-title">3. 토핑 추가</div>
            <div class="option-buttons" id="topping-group">
                <button class="opt-btn active" onclick="selectOpt('topping', '없음')">없음</button>
                <button class="opt-btn" onclick="selectOpt('topping', '휘핑크림')">휘핑크림 🍦</button>
                <button class="opt-btn" onclick="selectOpt('topping', '아이스크림')">아이스크림 🍨</button>
                <button class="opt-btn" onclick="selectOpt('topping', '초코칩')">초코칩 🍪</button>
            </div>
        </div>
    </div>

    <script>
        let recipe = {
            base: '말차',
            icon: '🍵',
            milk: '일반 우유',
            topping: '없음'
        };

        function selectOpt(type, val, icon = null) {
            recipe[type] = val;
            if(icon) recipe.icon = icon;

            // 버튼 active 상태 변경
            const group = document.getElementById(`${type}-group`);
            const btns = group.querySelectorAll('.opt-btn');
            btns.forEach(btn => {
                if(btn.innerText.includes(val)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            updatePreview();
        }

        function updatePreview() {
            document.getElementById('preview-icon').innerText = recipe.icon;
            
            let title = `${recipe.base} 라떼`;
            if (recipe.topping !== '없음') {
                title = `${recipe.topping} ${title}`;
            }
            
            document.getElementById('preview-title').innerText = title;
            document.getElementById('preview-recipe').innerText = 
                `베이스: ${recipe.base} | 우유: ${recipe.milk} | 토핑: ${recipe.topping}`;
        }
    </script>
</body>
</html>
